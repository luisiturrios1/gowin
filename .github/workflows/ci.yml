name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        go: ['1.26.x', '1.27.x']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Verify formatting and module metadata
        run: |
          test -z "$(gofmt -l .)"
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go mod verify
      - run: go vet ./...
      - run: go build ./...
      - run: go test -cover ./...
      - name: Race detector
        if: matrix.go == '1.27.x'
        run: go test -race ./...
      - name: Fuzz UTF-16 decoding
        if: matrix.go == '1.27.x'
        run: go test -run='^$' -fuzz=FuzzLegacyUTF16 -fuzztime=10s -parallel=2 .
      - name: Windows registry benchmark
        if: matrix.go == '1.27.x' && runner.os == 'Windows'
        run: go test -run='^$' -bench=BenchmarkRegistryRead -benchmem -benchtime=200ms .
      - name: Cross-compile other Windows architectures
        if: matrix.go == '1.27.x' && runner.os == 'Linux'
        run: |
          for arch in 386 arm64; do
            GOOS=windows GOARCH="$arch" go build ./...
            GOOS=windows GOARCH="$arch" go test -c -o "$RUNNER_TEMP/gowin-$arch.test.exe" .
          done

  vulnerabilities:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          cache: true
      - name: Check Windows code and tests
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 -test ./...
